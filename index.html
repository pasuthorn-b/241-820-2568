<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
ชื่อ<input 
        id ="fname"
        class = "input"
        type="text" 
        name="fname"
        value="ทดสอบชื่อ"/>
นามสกุล<input 
        id ="Iname"
        class = "input"
        type="text" 
        name="Iname"
        value="ทดสอบนามสกุล"/>
งานอดิเรก:
    <input type="checkbox" name="hobby" value="reading">Reading
    <input type="checkbox" name="hobby" value="traveling">Traveling
    <input type="checkbox" name="hobby" value="gaming">Gaming

<body>
        <button onclick = "userClicked()">คลิก!!</button>
        <div onclick="divclicked()">คลิก Div</div>
        <input type = "radio" name="gender" value="male"onchange="changeGender()"checked="true">Male
        <input type = "radio" name="gender" value="female"onchange="changeGender()">Female
    <script>
        let inputsDOM = document.getElementsByClassName("input");
        console.log(inputsDOM);
        for (let i =0;i<inputsDOM.length; i++){
            console.log(inputsDOM[i].Value);
        }
        //query selector
         let fname = document.querySelector('.input[name="fname"]');
          console.log(fname.value);
        //query selector all
        let checkboxsInputs = document.querySelectorAll('input[name="hobby"]');
        for (let i=0;i<checkboxsInputs.length;i++){
            console.log(checkboxsInputs[i].value);
        }
        //onclick
        function userClicked(){
            console.log("User clicked the button!");
        }
        function divclicked(){
            console.log("User clicked the div!");
        }
        //
        function changeGender(){
            //เลือก gender ทุก input ออกมา
            let gendersInputs = document.querySelectorAll('input[name="gender"]');
            //ใคร checked อยู่ = เพศโดนเลือก
            for (let i=0;i<gendersInputs.length;i++){
                if (gendersInputs[i].checked){
                    console.log("Gender selected:"+gendersInputs[i].value);
                }
            }
        }



    </script>
</body>
</html>
